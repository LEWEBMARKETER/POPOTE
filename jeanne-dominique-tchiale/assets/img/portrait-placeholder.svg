  <defs>
    <linearGradient id="jdtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1D28"/>
      <stop offset="55%" stop-color="#3A2C45"/>
      <stop offset="100%" stop-color="#0E8C86"/>
    </linearGradient>
    <linearGradient id="jdtLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C2185B"/>
