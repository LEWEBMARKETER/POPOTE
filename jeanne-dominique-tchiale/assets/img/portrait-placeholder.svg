  <text x="400" y="700" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" fill="#FBF8F5" fill-opacity="0.85" text-anchor="middle" letter-spacing="3">JEANNE DOMINIQUE TCHIALE</text>
  <text x="400" y="740" font-family="Arial, sans-serif" font-size="18" fill="#FBF8F5" fill-opacity="0.6" text-anchor="middle" letter-spacing="2">PHOTOGRAPHIE À INTÉGRER</text>
